# MARC2 Configuration
#
# Claude-powered work (Phases 1-3, 6, 8) runs via Claude Code subagents —
# no model configs needed here for those phases.
#
# This file configures only the MindRouter subject models used in Phases 4-8.

models:
  # --- Subject models (MindRouter) ---
  - name: gpt-oss-120b
    provider: openai_compat
    endpoint: "https://mindrouter.uidaho.edu/v1"
    model_id: "openai/gpt-oss-120b"
    api_key_env: MINDROUTER_API_KEY
    temperature: 0.0
    max_tokens: 4096
    reasoning_effort: high
    timeout: 300.0
    modality: text
    role: subject

  - name: gpt-oss-20b
    provider: openai_compat
    endpoint: "https://mindrouter.uidaho.edu/v1"
    model_id: "openai/gpt-oss-20b"
    api_key_env: MINDROUTER_API_KEY
    temperature: 0.0
    max_tokens: 4096
    reasoning_effort: high
    timeout: 300.0
    modality: text
    role: subject

  - name: qwen3.5-122b
    provider: openai_compat
    endpoint: "https://mindrouter.uidaho.edu/v1"
    model_id: "qwen/qwen3.5-122b"
    api_key_env: MINDROUTER_API_KEY
    temperature: 0.0
    max_tokens: 4096
    reasoning_effort: high
    timeout: 300.0
    modality: text
    role: subject

  - name: qwen3.5-400b
    provider: openai_compat
    endpoint: "https://mindrouter.uidaho.edu/v1"
    model_id: "qwen/qwen3.5-400b"
    api_key_env: MINDROUTER_API_KEY
    temperature: 0.0
    max_tokens: 4096
    reasoning_effort: high
    timeout: 600.0
    modality: text
    role: subject

  - name: gemma-4-31b
    provider: openai_compat
    endpoint: "https://mindrouter.uidaho.edu/v1"
    model_id: "google/gemma-4-31b"
    api_key_env: MINDROUTER_API_KEY
    temperature: 0.0
    max_tokens: 4096
    timeout: 300.0
    modality: text
    role: subject

  - name: gemma-4-26b
    provider: openai_compat
